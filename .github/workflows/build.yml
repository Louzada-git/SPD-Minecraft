name: Build

on: [push, pull_request]

# Precisa poder escrever no repositório pra guardar o jar no branch "jar"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pixeldungeon-jar
          path: build/libs/*.jar

      # Guarda o jar mais novo no branch "jar" (só ele, sem histórico), pra dar pra baixar direto pelo git
      - name: Publish jar to the jar branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/jar
          cp build/libs/*.jar /tmp/jar/
          cd /tmp/jar
          git init -q -b jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.jar
          git commit -q -m "Jar do commit ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" jar

      # Liga um servidor de verdade com o mod, espera o mundo ser criado e confere se a run começou
      # (o andar 1 é construído quando o servidor liga). Depois desliga.
      - name: Test server start
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ./gradlew runServer > servidor.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Teste do Goo" servidor.log; then break; fi
            if grep -q "BUILD FAILED" servidor.log; then break; fi
            if grep -qE "at .*com\.louzada\.pixeldungeon" servidor.log; then break; fi
            sleep 5
          done
          sleep 5
          pkill -f "net.neoforged" || true
          pkill -f "gradle" || true
          echo "----- final do log do servidor -----"
          grep -v "DEBUG" servidor.log | tail -60
          if ! grep -q "Done (" servidor.log; then echo "O servidor não terminou de ligar"; exit 1; fi
          echo "----- andares construídos -----"
          grep "construído em" servidor.log || true
          echo "----- inimigos -----"
          grep -E "Andar [0-9]+: [0-9]+ inimigos" servidor.log || true
          if ! grep -q "Começando a run 1" servidor.log; then echo "A run não começou"; exit 1; fi
          if grep -qE "at .*com\.louzada\.pixeldungeon" servidor.log; then echo "Deu erro no código do mod:"; grep -B5 -A5 -E "at .*com\.louzada\.pixeldungeon" servidor.log | head -60; exit 1; fi
          if ! grep -q "Andar 5 construído" servidor.log; then echo "Nem todos os andares foram construídos"; exit 1; fi
          if ! grep -q "Andar 1: 8 inimigos" servidor.log; then echo "Os inimigos do andar 1 não nasceram"; exit 1; fi
          grep -E "Teste|Goo no ninho" servidor.log || true
          if ! grep -qE "Teste do enxame: [2-9] enxames" servidor.log; then echo "O enxame não se dividiu"; exit 1; fi
          if ! grep -q "Teste de combate" servidor.log; then echo "O teste de combate não rodou"; exit 1; fi
          if ! grep -q "Teste dos talentos: refeição saudável +2, determinação de ferro +0, pontos livres 0" servidor.log; then echo "Os talentos não funcionaram"; exit 1; fi
          if ! grep -q "Teste do selo: tem selo = true, blindagem do selo = 5" servidor.log; then echo "O selo do Guerreiro não funcionou"; exit 1; fi
          if ! grep -qE "Teste da Duelista: cortar tirou [1-9][0-9.]* de vida do rato, sobraram 1 cargas" servidor.log; then echo "A habilidade da Duelista não funcionou"; exit 1; fi
          if ! grep -q "Teste do Clérigo: arma celestial = true, cargas do tomo = 1" servidor.log; then echo "O tomo do Clérigo não funcionou"; exit 1; fi
          if ! grep -q "Teste do Ladino: invisível = true, cargas da capa = 2" servidor.log; then echo "A capa do Ladino não funcionou"; exit 1; fi
          if ! grep -qE "Andar [1-4]: [0-9]+ quadradinhos de grama \([1-9][0-9]* de grama alta\)" servidor.log; then echo "Não nasceu grama alta"; exit 1; fi
          if ! grep -qE "Teste da grama: (era grama alta = true, virou musgo = true|o andar 1 não tem grama alta)" servidor.log; then echo "A grama alta não foi pisoteada"; exit 1; fi
          if ! grep -q "Teste do odre: gotas depois da gota = 1, vida 15.0 -> 16.0, gotas depois de beber = 0" servidor.log; then echo "O odre não funcionou"; exit 1; fi
          if ! grep -q "Teste do míssil mágico: acertou o rato = true" servidor.log; then echo "O míssil mágico não acertou o rato"; exit 1; fi
          if ! grep -q "Andar 5: Goo no ninho" servidor.log; then echo "O Goo não nasceu no andar 5"; exit 1; fi
          if ! grep -qE "Teste do Goo: tinha 80 de vida, depois de 5 s na água ficou com 8[1-9]" servidor.log; then echo "O Goo não se curou na água"; exit 1; fi
          echo "----- saque dos andares -----"
          grep -E "Andar [0-9]+: [0-9]+ itens" servidor.log || true
          if ! grep -qE "Andar 1: ([4-9]|[1-9][0-9]) itens" servidor.log; then echo "Os itens do andar 1 não apareceram"; exit 1; fi
          echo "----- salas e portas -----"
          grep -E "Andar [0-9]+: [0-9]+x[0-9]+ quadradinhos" servidor.log || true
          if ! grep -qE "Andar 1: [0-9]+x[0-9]+ quadradinhos, [0-9]+ salas, [1-9][0-9]* portas, [1-9] trancadas, [1-9] chaves de ferro" servidor.log; then echo "O andar 1 não tem as portas do Shattered"; exit 1; fi
          if ! grep -q "Teste das portas: comum fechada no começo = true, trancada fechada no começo = true" servidor.log; then echo "As portas não começaram fechadas"; exit 1; fi
          if ! grep -q "Teste das portas: a comum abriu com o rato perto = true, a trancada continuou fechada = true" servidor.log; then echo "As portas não abriram direito"; exit 1; fi
          if ! grep -q "Teste da chave de ferro: destrancou = true, gastou a chave = true, ficou comum = true" servidor.log; then echo "A chave de ferro não funcionou"; exit 1; fi
          if ! grep -q "Teste das armas: 31 armas, 31 com habilidade, por tier 5/6/6/7/7" servidor.log; then echo "As armas novas não estão certas"; exit 1; fi
          if ! grep -q "Teste da espada larga: o rato morreu = true" servidor.log; then echo "A espada larga não cortou"; exit 1; fi
          if ! grep -q "Teste do ouro: ouro do herói = 50, a pilha sumiu = true, pilha do andar 3 com moedas entre 60 e 120 = true" servidor.log; then echo "O ouro não funcionou"; exit 1; fi
          if ! grep -q "Teste do baú: tem a espada dentro = true" servidor.log; then echo "O baú não guardou o item"; exit 1; fi
          if ! grep -q "Teste do mímico: era mímico = true, o baú sumiu = true, vida 12.0, guardava 2 itens, caíram 2" servidor.log; then echo "O mímico não funcionou"; exit 1; fi
          if ! grep -q "Teste dos drops: gnoll deixou ouro = true, slime deixou arma de tier 2 = true" servidor.log; then echo "Os inimigos não deixaram itens"; exit 1; fi
          if ! grep -q "Teste da poção de força: força 10 -> 11, conhece = true" servidor.log; then echo "A poção de força não funcionou"; exit 1; fi
          if ! grep -q "Teste da poção de cura: curando = true" servidor.log; then echo "A poção de cura não funcionou"; exit 1; fi
          if ! grep -q "Teste do gás paralisante: o rato ficou paralisado = true" servidor.log; then echo "O gás paralisante não funcionou"; exit 1; fi
          if ! grep -q "Teste das plantas: plantou = true, ativou = true, a planta sumiu = true" servidor.log; then echo "As plantas não funcionaram"; exit 1; fi
          if ! grep -q "Teste da identificação pelo uso: começou desconhecida = true, depois de 20 golpes conhecida = true" servidor.log; then echo "A arma não se identificou com o uso"; exit 1; fi
          if ! grep -q "Teste do pergaminho de identificação: arma identificada = true, pergaminho gasto = true" servidor.log; then echo "O pergaminho de identificação não funcionou"; exit 1; fi
          if ! grep -qE "Teste do pergaminho de melhoria: nível (0 -> 1|1 -> 2|2 -> 3)" servidor.log; then echo "O pergaminho de melhoria não funcionou"; exit 1; fi
          if ! grep -q "Teste do pergaminho de remover maldição: ainda amaldiçoada = false" servidor.log; then echo "O pergaminho de remover maldição não funcionou"; exit 1; fi
          if ! grep -q "Teste da maldição polarizante: dano 0 ou 15 = true" servidor.log; then echo "A maldição polarizante não funcionou"; exit 1; fi
          if ! grep -q "Teste da transmutação: virou outra arma = true, nível = 2" servidor.log; then echo "A transmutação não funcionou"; exit 1; fi
          if ! grep -q "Teste do saque: poções de força = 2, pergaminhos de melhoria = 3" servidor.log; then echo "As poções de força e os pergaminhos de melhoria não caíram"; exit 1; fi
          if ! grep -q "Teste das sementes: 2 sementes sorteadas" servidor.log; then echo "As sementes não foram sorteadas"; exit 1; fi
          if ! grep -q "Teste das armaduras: por tier 1/1/1/1/1" servidor.log; then echo "As armaduras não estão certas"; exit 1; fi
          if ! grep -q "Teste da armadura: começou desconhecida = true, depois de 20 golpes recebidos conhecida = true" servidor.log; then echo "A armadura não se identificou"; exit 1; fi
          if ! grep -qE "Teste do combate: o rato acertou [0-9]+ de 20 golpes" servidor.log; then echo "O combate novo não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadura amaldiçoada: descobriu = true, grudou = true" servidor.log; then echo "A armadura amaldiçoada não grudou"; exit 1; fi
          if ! grep -q "Teste da armadura amaldiçoada: soltou depois de remover a maldição = true" servidor.log; then echo "A armadura não soltou"; exit 1; fi
          if ! grep -q "Teste do peso: placas com 10 de força deixam mais lento = true" servidor.log; then echo "A armadura pesada não deixou lento"; exit 1; fi
          if ! grep -q "Teste do tier 2: no nível 6 aprimorou = false, no nível 7 tinha 1 ponto e aprimorou = true, no nível 12 sobram 5 do tier 2 e 5 do tier 1" servidor.log; then echo "Os pontos do tier 2 não estão certos"; exit 1; fi
          if ! grep -q "Teste do estômago de ferro: a ração leva 1 turno" servidor.log; then echo "O estômago de ferro não funcionou"; exit 1; fi
          if ! grep -qE "Teste da tenacidade líquida: ganhou [1-9][0-9.]* de blindagem, 10% da vida máxima = true" servidor.log; then echo "A tenacidade líquida não funcionou"; exit 1; fi
          if ! grep -q "Teste do ímpeto letal: ataque pronto = true" servidor.log; then echo "O ímpeto letal não funcionou"; exit 1; fi
          if ! grep -q "Teste do poder inscrito: depois de um pergaminho = 2, depois da melhoria = 4, bônus do disparo = 2, sobraram 3" servidor.log; then echo "O poder inscrito não funcionou"; exit 1; fi
          if ! grep -q "Teste dos passos silenciosos: silencioso a 2 = false, a 3 = true" servidor.log; then echo "Os passos silenciosos não funcionaram"; exit 1; fi
          if ! grep -q "Teste da Duelista no tier 2: cargas depois de comer = 1, evasão 10 -> 30.0" servidor.log; then echo "A refeição focada ou a agilidade líquida não funcionaram"; exit 1; fi
          if ! grep -q "Teste da recuperar inscrição: conhece as 7 magias = true, repetiu a recarga = true, cargas do tomo = 0, ainda lembra = false" servidor.log; then echo "A recuperar inscrição não funcionou"; exit 1; fi
          if ! grep -q "Teste da bênção: sentido divino = true, abençoado = true, blindagem +10.0, cargas do tomo = 0" servidor.log; then echo "A bênção ou o sentido divino não funcionaram"; exit 1; fi
          if ! grep -q "Teste das armas de arremesso: 15 armas, por tier 3/3/3/3/3, pedra 2-5 com força 9" servidor.log; then echo "As armas de arremesso não estão certas"; exit 1; fi
          if ! grep -q "Teste da durabilidade: o Guerreiro começa com 3 pedras, a pedra gasta 20.0 por acerto, com projéteis duráveis +2 gasta 11.1" servidor.log; then echo "A durabilidade das armas de arremesso não está certa"; exit 1; fi
          if ! grep -q "Teste de juntar: 2 inteiras + 1 com 80 = 3 com 80, 1 com 30 + 1 com 50 = 1 com 80" servidor.log; then echo "As armas de arremesso não se juntaram direito"; exit 1; fi
          if ! grep -q "Teste do saque de arremesso: quantidade 3, identificada = false, acertos pra identificar = 10" servidor.log; then echo "As armas de arremesso do chão não estão certas"; exit 1; fi
          if ! grep -q "Teste da faca cravada: cravadas = 1, caiu quando o rato morreu = true" servidor.log; then echo "A faca cravada não caiu"; exit 1; fi
          if ! grep -q "Teste do arremesso: ficaram 2 pedras na mão" servidor.log; then echo "A pedra não foi arremessada"; exit 1; fi
          if ! grep -q "Teste do arremesso: acertou o rato = true, a pedra caiu no chão = true" servidor.log; then echo "A pedra arremessada não acertou o rato"; exit 1; fi
          if ! grep -q "Teste das varinhas: 13 varinhas, míssil mágico com 3 cargas, relâmpago 5-10 no +0 e 6-15 no +1" servidor.log; then echo "As varinhas não estão certas"; exit 1; fi
          if ! grep -q "Teste do saque de varinha: identificada = false, disparos pra identificar = 10" servidor.log; then echo "As varinhas do chão não estão certas"; exit 1; fi
          if ! grep -q "Teste da varinha do relâmpago: acertou o rato = true, cargas 1/2, identificou = true" servidor.log; then echo "A varinha do relâmpago não funcionou"; exit 1; fi
          if ! grep -q "Teste da recarga nas varinhas: cargas 2/2" servidor.log; then echo "O pergaminho de recarga não encheu a varinha"; exit 1; fi
          if ! grep -q "Teste do cajado: varinha = relampago, nível 2, cargas 5/5, devolveu a de míssil mágico = true, gastou a nova = true" servidor.log; then echo "O cajado não recebeu a varinha"; exit 1; fi
          if ! grep -q "Teste dos anéis: 12 anéis, cada gema esconde um tipo diferente = true, o achado vem sem identificar = true" servidor.log; then echo "Os anéis não estão certos"; exit 1; fi
          if ! grep -q "Teste do anel do poder: foi pra casinha = true, conhece o tipo = true, força 10 -> 12" servidor.log; then echo "O anel do poder não funcionou"; exit 1; fi
          if ! grep -q "Teste da identificação do anel: identificou = true" servidor.log; then echo "O anel não se identificou com a experiência"; exit 1; fi
          if ! grep -q "Teste do anel amaldiçoado: bônus -2, grudou = true" servidor.log; then echo "O anel amaldiçoado não funcionou"; exit 1; fi
          if ! grep -qE "Teste dos glifos: [0-9]+ de 400 armaduras com glifo, perto de 15% = true, junto com maldição = false" servidor.log; then echo "Os glifos não aparecem nas armaduras como no Shattered"; exit 1; fi
          if ! grep -qE "Teste do glifo de pedra: esquiva 0 = true, dano 10 -> [0-9.]+ \(menor = true\)" servidor.log; then echo "O glifo de pedra não funcionou"; exit 1; fi
          if ! grep -q "Teste do glifo da viscosidade: 10 -> 8.0, adiado 2.0" servidor.log; then echo "O glifo da viscosidade não funcionou"; exit 1; fi
          if ! grep -q "Teste do glifo de espinhos: o rato sangrou = true" servidor.log; then echo "O glifo de espinhos não funcionou"; exit 1; fi
          if ! grep -q "Teste do glifo de enxofre: apagou o fogo = true" servidor.log; then echo "O glifo de enxofre não funcionou"; exit 1; fi
          if ! grep -q "Teste do glifo de rapidez: mais rápido sem inimigos perto = true" servidor.log; then echo "O glifo de rapidez não funcionou"; exit 1; fi
          if ! grep -q "Teste do glifo do potencial: carga da varinha 0 -> 1" servidor.log; then echo "O glifo do potencial não funcionou"; exit 1; fi
          if ! grep -q "Teste do selo: a nova ficou com o selo = true, +1, glifo de pedra = true; a velha voltou pra +0, sem glifo = true" servidor.log; then echo "O selo não passou pra outra armadura"; exit 1; fi
          if ! grep -q "Teste do selo solto: foi pra mochila com o aprimoramento e o glifo = true, afixado de novo +1 com glifo de pedra = true" servidor.log; then echo "O selo solto não funcionou"; exit 1; fi
          if ! grep -qE "Teste dos encantamentos: [0-9]+ de 400 armas encantadas, perto de 10% = true, junto com maldição = false" servidor.log; then echo "Os encantamentos não aparecem nas armas como no Shattered"; exit 1; fi
          if ! grep -q "Teste do flamejante e do congelante: pegou fogo = true, resfriado = true" servidor.log; then echo "O flamejante ou o congelante não funcionaram"; exit 1; fi
          if ! grep -q "Teste do vorpal: o golpe virou sangramento = true" servidor.log; then echo "O vorpal não funcionou"; exit 1; fi
          if ! grep -q "Teste do mortal: executou = true" servidor.log; then echo "O mortal não funcionou"; exit 1; fi
          if ! grep -qE "Teste do inercial: guardou 12.0, o próximo golpe de 1 deu 13.0" servidor.log; then echo "O inercial não funcionou"; exit 1; fi
          if ! grep -q "Teste da corrupção: marcou = true, voltou como aliado = true, não persegue o herói = true" servidor.log; then echo "A corrupção não funcionou"; exit 1; fi
          if ! grep -qE "Teste do projetante: alcance 3.0 -> 7.0" servidor.log; then echo "O projetante não funcionou"; exit 1; fi
          if ! grep -q "Teste da maldição amigável: o golpe não machucou = true, o rato ficou encantado = true" servidor.log; then echo "A maldição amigável não funcionou"; exit 1; fi
          if ! grep -q "Teste da maldição explosiva: explodiu e recomeçou = true" servidor.log; then echo "A maldição explosiva não funcionou"; exit 1; fi
          if ! grep -qE "Teste das salas secretas: [0-9]+ salas secretas nos andares 2 a 4, pelo menos 2 = true; portas escondidas no andar 1 = 0, nos outros = [1-9]" servidor.log; then echo "As salas secretas não foram geradas como no Shattered"; exit 1; fi
          if ! grep -qE "Teste da busca: achou [1-9][0-9]* porta\(s\) ao procurar do lado; antes era parede = true, virou porta = true, ficou salvo = true, procurar de novo logo em seguida achou 0" servidor.log; then echo "A busca não achou a porta escondida"; exit 1; fi
          if ! grep -qE "Teste do mapeamento das portas: revelou [0-9]+ no andar [0-9], revelou alguma = true, sobrou escondida = 0" servidor.log; then echo "O mapeamento mágico não revelou as portas escondidas"; exit 1; fi
          if ! grep -q "Teste da previsão do ladino: com +2 avisou = true, sem o talento avisou = false, no andar 1 avisou = false" servidor.log; then echo "A previsão do ladino não funcionou"; exit 1; fi
          if ! grep -q "Teste do labirinto: 200 prêmios, amaldiçoados = 0, maldição desconhecida = 0, metade armaduras = true" servidor.log; then echo "O prêmio do labirinto não saiu como no Shattered"; exit 1; fi
          if ! grep -qE "Teste da terra viva: o disparo virou [4-6] de pedra, efeito = true, no máximo 16, golpe de 6 virou 3.0 e a pedra ficou 13" servidor.log; then echo "A armadura de pedra não funcionou"; exit 1; fi
          if ! grep -q "Teste do guardião da terra: nasceu aliado = true, vida 16.0 (a pedra era 13), a pedra foi pra ele = true, voltou sem inimigos = true, virou 16 de pedra" servidor.log; then echo "O guardião da terra não funcionou"; exit 1; fi
          if ! grep -q "Teste dos efeitos novos: feitiço deixa 0.8 da precisão, lento deixa 0.5 da velocidade, condenado fez 3 de dano virar 5.01" servidor.log; then echo "Os efeitos da corrupção não funcionaram"; exit 1; fi
          if ! grep -qE "Teste da varinha de corrupção: resistência [0-9.]+ com a vida cheia, ficou com efeito ruim = true; ferido [0-9.]+, corrompido = true, ganhou XP = true" servidor.log; then echo "A varinha de corrupção não funcionou"; exit 1; fi
          if ! grep -q "Teste da corrupção no chefe: ficou condenado = true, virou aliado = false" servidor.log; then echo "A corrupção no chefe não funcionou"; exit 1; fi
          if ! grep -q "Teste da varinha de proteção: sem varinha na mochila pode = false, com ela pode = true, a guarda nasceu nível 1, melhorou pra 2, energia 2/2, sem energia pra outra = true" servidor.log; then echo "A varinha de proteção não funcionou"; exit 1; fi
          if ! grep -q "Teste da guarda: disparou no rato = true, disparos 1, virou sentinela nível 4 com vida 31.0/35.0" servidor.log; then echo "A guarda não funcionou"; exit 1; fi
          if ! grep -q "Teste dos números das armas novas: lança 2-20 (+1: 3-24), alcance +4.0 blocos, escudo redondo defende 4 (+1: 5), machado grande pede 20 de força, lâmina rúnica +1 até 26, mangual ataca de surpresa = false" servidor.log; then echo "Os números das armas novas não estão certos"; exit 1; fi
          if ! grep -q "Teste das posturas: postura defensiva por 4 turnos = true, dança da espada deixa o ataque 1.6x mais rápido" servidor.log; then echo "As posturas da Duelista não funcionaram"; exit 1; fi
          if ! grep -q "Teste do escudo: atacar antes de bloquear não acabou = true, anulou o golpe = true, a defesa acabou depois de atacar = true" servidor.log; then echo "A defesa do escudo não funcionou"; exit 1; fi
          if ! grep -q "Teste da foice: sangrando = true, a vida não mudou na hora = true" servidor.log; then echo "Ceifar não funcionou"; exit 1; fi
          if ! grep -q "Teste da lança: perto demais não gastou carga = true, de longe acertou = true, empurrou = true" servidor.log; then echo "Espetar não funcionou"; exit 1; fi
          if ! grep -q "Teste do chicote: acertou os dois = true" servidor.log; then echo "Chicotear não funcionou"; exit 1; fi
          if ! grep -qE "Teste do mangual: 3 voltas gastaram 1 carga, a 4ª não deu = true, o golpe tirou [0-9]+ de vida \(pelo menos 24 a mais\) = true, parou de girar = true" servidor.log; then echo "Girar não funcionou"; exit 1; fi
          if ! grep -q "Teste da besta: carregou = true, o golpe arremessou o rato = true, descarregou = true" servidor.log; then echo "O tiro carregado não funcionou"; exit 1; fi
          if ! grep -q "Teste da lâmina rúnica: pegou fogo 5 de 5" servidor.log; then echo "O corte rúnico não funcionou"; exit 1; fi
          if ! grep -q "Teste do machado grande: com a vida cheia não deu = true, ferido acertou = true, mangual faz surpresa = false" servidor.log; then echo "A retribuição não funcionou"; exit 1; fi
          if ! grep -q "Teste do saque de artefatos: 10 artefatos diferentes em 10 sorteios, o seguinte virou anel" servidor.log; then echo "Os artefatos não são únicos por run"; exit 1; fi
          if ! grep -qE "Teste do cálice de sangue: subiu pro nível 1, dano no \+0 3-7 e no \+10 253-357, a mais de cura em 100 turnos no \+1: [12]\.0, desenho 0\.0" servidor.log; then echo "O cálice de sangue não funcionou"; exit 1; fi
          if ! grep -q "Teste do chifre da fartura: 2 níveis de XP deram 2 cargas, lanchou = true (fome 5 virou 8), a ração subiu ele pro nível 1 (sobrou ração = false)" servidor.log; then echo "O chifre da fartura não funcionou"; exit 1; fi
          if ! grep -q "Teste da ampulheta do tempo: veio com 5 cargas, estase = true (invisível = true, o veneno pegou = false) e ficou com 3, parou o tempo = true e ficou com 2, atacar soltou = true" servidor.log; then echo "A ampulheta do tempo não funcionou"; exit 1; fi
          if ! grep -qE "Teste do livro instável: veio com 2 cargas, nunca saiu melhoria nem transmutação = true, identificação em [0-9]+ de 2000, pede 10 pergaminhos, alimentado subiu pro nível 1 e pede 9, leu = true e ficou com 1 cargas" servidor.log; then echo "O livro instável não funcionou"; exit 1; fi
          if ! grep -qE "Teste das correntes etéreas: vieram com 5 cargas, puxou o rato = true \(ficou a [0-9.]+ blocos\) e ficaram 2, a XP de 1 nível deixou 8, puxou o herói até a parede = true \(andou 19\.0 blocos\) e ficaram 3" servidor.log; then echo "As correntes etéreas não funcionaram"; exit 1; fi
          if ! grep -qE "Teste da braçadeira do ladrão: 1 nível de XP deu 3 cargas, roubou a carne do rato albino = true, ele ficou cego e aleijado = true, marcado = true, ao morrer deixou 0 carnes, sobrou 2 carga" servidor.log; then echo "A braçadeira do ladrão não funcionou"; exit 1; fi
          if ! grep -qE "Teste das sandálias da natureza: 10 pisoteadas deram 5 de carga, 3 sementes subiram pro nível 1 \((Shoes of Nature|item\.pixeldungeon\.sandalias_da_natureza\.nome_1)\), aceita a mesma de novo = true, enraizou a flor-estrela = true \(o rato no lugar ficou abençoado = true\) e ficou com 60" servidor.log; then echo "As sandálias da natureza não funcionaram"; exit 1; fi
          if ! grep -qE "Teste da chave de crânio: veio com 3 cargas, destrancou a porta trancada = true \(ficou 2\), trancou a porta = true \(do herói = true, ficou 0\), abriu a dela de graça = true, levantou paredes = true \([1-9][0-9]* blocos de parede, o rato foi empurrado = true\)" servidor.log; then echo "A chave de crânio não funcionou"; exit 1; fi
          if ! grep -q "Teste do talismã da vidência: sem carga não vê = true, viu 7 quadradinhos = true (100 virou 89), o rato brilhou = true, achar 2 portas deu 20" servidor.log; then echo "O talismã da vidência não funcionou"; exit 1; fi
          if ! grep -qE "Teste do fantasma triste: apareceu no andar 4 = true, missão 3, arma do tier [2-5] e armadura do tier [2-5] \(2 a 5 = true\), nível \+[0-3] nas duas = true" servidor.log; then echo "O fantasma triste não apareceu direito"; exit 1; fi
          if ! grep -q "Teste da missão do fantasma: o fantasma é invulnerável = true, a conversa deu a missão = true e o caranguejo nasceu = true, bloqueou o golpe = true e a magia = true, distraído apanhou = true, morto deixou 2 carnes, cumprida = true, escolheu a armadura = true (ganhou = true), o fantasma foi embora = true, completa = true" servidor.log; then echo "A missão do fantasma não funcionou"; exit 1; fi
          if ! grep -qE "Teste do gnoll trapaceiro: acertou [1-9][0-9]* de 20 dardos, sequência [1-9][0-9]*, envenenou ou pôs fogo = true, deixou armas de arremesso = true \(2 de \+0, identificadas = true\)" servidor.log; then echo "O gnoll trapaceiro não funcionou"; exit 1; fi
          if ! grep -q "Teste do rato fétido: deixou muco cáustico = true, apanhando soltou fedor = true, é chefe (não corrompe) = true" servidor.log; then echo "O rato fétido não funcionou"; exit 1; fi
          if ! grep -qE "Teste da rosa seca: sem a missão não funciona = true, veio com 100 de carga, chamou o fantasma = true \(vida 40.0, ficou 0 de carga\), sem arma bate até [45], levou a arma = true, devolveu = true, obedeceu as ordens = true, a rosa curou [78].0 em 100 turnos, a pétala subiu a rosa pro nível 1" servidor.log; then echo "A rosa seca não funcionou"; exit 1; fi
          if ! grep -q "Teste das pétalas: sem a missão 0 no andar 4, com a missão 1" servidor.log; then echo "As pétalas da rosa não aparecem"; exit 1; fi
          if ! grep -qE "Teste das armadilhas nos andares: por andar [1-9][0-9]*/[1-9][0-9]*/[1-9][0-9]*/[1-9][0-9]*, escondidas nos andares 2 a 4 = [1-9][0-9]*, andar 1 só de dardos = true, tipos do esgoto = true, só em chão vazio = true, construídas iguais à planta = true, fora dos lugares de itens e inimigos = true" servidor.log; then echo "As armadilhas não foram sorteadas como no Shattered"; exit 1; fi
          if ! grep -q "Teste da sala das armadilhas: tem armadilhas = true, todas à vista = true, um tipo só da sala = true, baú com prêmio = true, o baú fora das armadilhas = true, poção de levitação no andar = true" servidor.log; then echo "A sala das armadilhas não está certa"; exit 1; fi
          if ! grep -q "Teste do tesouro secreto: tem armadilhas de desmoronamento ou de dardo venenoso = true, todas à vista = true" servidor.log; then echo "O tesouro secreto ficou sem armadilhas"; exit 1; fi
          if ! grep -q "Teste da invocação secreta: o chão todo de armadilhas de invocação = true, todas escondidas = true, o item em cima de uma = true" servidor.log; then echo "A sala de invocação secreta não está certa"; exit 1; fi
          if ! grep -q "Teste da armadilha de dardos: nunca fica escondida = true, o rato em cima levou o dardo = true, desarmou = true" servidor.log; then echo "A armadilha de dardos não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de dardo venenoso: acertou o rato mais perto = true" servidor.log; then echo "A armadilha de dardo venenoso não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de resfriamento: nuvem = true, resfriado = true, congelou no turno 4" servidor.log; then echo "A armadilha de resfriamento não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha elétrica: nuvem = true, o rato do lado ficou paralisado = true" servidor.log; then echo "A armadilha elétrica não funcionou"; exit 1; fi
          if ! grep -q "Teste das armadilhas de gás: tóxico = true, confusão = true" servidor.log; then echo "As armadilhas de gás não funcionaram"; exit 1; fi
          if ! grep -q "Teste da armadilha de alarme: acordou = true, foi chamado = true" servidor.log; then echo "A armadilha de alarme não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de muco: o rato do lado = true, o enxame (voa) = false" servidor.log; then echo "A armadilha de muco não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de rebanho: 24 ovelhas, somem sozinhas = true" servidor.log; then echo "A armadilha de rebanho não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de invocação: invocou de 1 a 3 = true" servidor.log; then echo "A armadilha de invocação não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha agarradora: sangrou = true, aleijou = true, continua armada = true, agarrou de novo quem ficou parado = false" servidor.log; then echo "A armadilha agarradora não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de desmoronamento: acertou os 2 ratos = true" servidor.log; then echo "A armadilha de desmoronamento não funcionou"; exit 1; fi
          if ! grep -q "Teste das armadilhas escondidas: o rato não ativou a escondida = true, o rato ativou a que estava à vista = true, o herói ativou a escondida = true, o enxame (voa) não ativou = true" servidor.log; then echo "As armadilhas escondidas não funcionaram"; exit 1; fi
          if ! grep -q "Teste das armadilhas com itens: o item que já estava lá não ativou = true, o que caiu em cima ativou = true" servidor.log; then echo "Os itens não ativaram as armadilhas"; exit 1; fi
          if ! grep -q "Teste do caminho dos inimigos: desviam da armadilha à vista = true, da escondida = false, da desarmada = false" servidor.log; then echo "Os inimigos não desviam das armadilhas"; exit 1; fi
          if ! grep -q "Teste da armadilha de teletransporte: o rato foi pra longe = true, o item também = true, desarmou = true" servidor.log; then echo "A armadilha de teletransporte não funcionou"; exit 1; fi
          if ! grep -q "Teste da armadilha de portal: os 2 ratos foram pro mesmo lugar = true, continua armada = true" servidor.log; then echo "A armadilha de portal não funcionou"; exit 1; fi
          if ! grep -qE "Teste da busca de armadilhas: o talismã avisou = true, achou [1-9][0-9]* segredo\(s\), a armadilha apareceu = true" servidor.log; then echo "A busca não achou a armadilha"; exit 1; fi
          if ! grep -q "Teste do mapeamento das armadilhas: revelou alguma = true, sobrou escondida = 0, o talismã parou de avisar = true" servidor.log; then echo "O mapeamento mágico não revelou as armadilhas"; exit 1; fi
          echo "Servidor ligou, os 5 andares foram construídos e o Goo está no ninho"

      # Liga o jogo de verdade (sem monitor, no Xvfb), entra no mundo do teste do servidor
      # e tira fotos da tela do jogo e do inventário (ficam nos arquivos do teste, em "fotos")
      - name: Client screenshots
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 > /dev/null
          # Espera o servidor do teste anterior terminar de salvar o mundo
          for i in $(seq 1 30); do pgrep -f "net.neoforged" > /dev/null || break; sleep 2; done
          mkdir -p run/saves
          rm -rf run/saves/teste
          cp -r run/world run/saves/teste
          rm -f run/saves/teste/session.lock
          printf "onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:0\nrenderDistance:6\nsoundCategory_master:0.0\n" > run/options.txt
          FOTOGRAFAR=1 timeout 1200 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient > cliente.log 2>&1 &
          # O jogo tira as fotos e avisa "pronto" (ou desiste depois de 5 minutos); aí é só desligar
          for i in $(seq 1 120); do
            if grep -qE "Fotos de teste: (pronto|o herói não entrou)" cliente.log; then break; fi
            if grep -q "BUILD FAILED" cliente.log; then break; fi
            sleep 5
          done
          sleep 5
          pkill -f "net.neoforged" || true
          pkill -f "gradle" || true
          pkill -f "Xvfb" || true
          echo "----- jogo -----"
          grep -E "Fotos de teste|Herói das fotos|OpenGL|GL version|Exception|ERROR|FATAL" cliente.log | grep -v DEBUG | head -80
          if ! ls run/screenshots/*.png > /dev/null 2>&1; then echo "Sem fotos. Final do log:"; grep -v DEBUG cliente.log | tail -80; fi
          ls -la run/screenshots || true

      # Guarda as fotos no branch "fotos" (só elas, sem histórico), pra dar pra ver pelo git
      - name: Publish screenshots to the fotos branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          if ! ls run/screenshots/*.png > /dev/null 2>&1; then echo "Sem fotos"; exit 0; fi
          mkdir -p /tmp/fotos
          cp run/screenshots/*.png /tmp/fotos/
          cd /tmp/fotos
          git init -q -b fotos
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.png
          git commit -q -m "Fotos do commit ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" fotos
