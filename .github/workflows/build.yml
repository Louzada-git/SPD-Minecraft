name: Build

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Export classpath
        run: |
          ./gradlew mostrarClasspath | grep "^CP:" | cut -c4- > cp.txt
          mkdir -p /tmp/cp
          while read f; do if [ -f "$f" ]; then cp "$f" /tmp/cp/; fi; done < cp.txt
          find /tmp/cp -size +95M -print -delete
          du -sh /tmp/cp; ls /tmp/cp | wc -l
          cd /tmp/cp
          git init -q -b classpath
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "classpath"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" classpath
