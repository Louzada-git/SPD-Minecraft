name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pixeldungeon-jar
          path: build/libs/*.jar

      # Liga um servidor de verdade com o mod, espera o mundo ser criado e confere se a run começou
      # (o andar 1 é construído quando o servidor liga). Depois desliga.
      - name: Test server start
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ./gradlew runServer > servidor.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Andar 5 construído" servidor.log; then break; fi
            if grep -q "BUILD FAILED" servidor.log; then break; fi
            if grep -qE "at .*com\.louzada\.pixeldungeon" servidor.log; then break; fi
            sleep 5
          done
          sleep 5
          pkill -f "net.neoforged" || true
          pkill -f "gradle" || true
          echo "----- final do log do servidor -----"
          grep -v "DEBUG" servidor.log | tail -60
          if ! grep -q "Done (" servidor.log; then echo "O servidor não terminou de ligar"; exit 1; fi
          echo "----- andares construídos -----"
          grep "construído em" servidor.log || true
          echo "----- inimigos -----"
          grep -E "Andar [0-9]+: [0-9]+ inimigos" servidor.log || true
          if ! grep -q "Começando a run 1" servidor.log; then echo "A run não começou"; exit 1; fi
          if grep -qE "at .*com\.louzada\.pixeldungeon" servidor.log; then echo "Deu erro no código do mod:"; grep -B5 -A5 -E "at .*com\.louzada\.pixeldungeon" servidor.log | head -60; exit 1; fi
          if ! grep -q "Andar 5 construído" servidor.log; then echo "Nem todos os andares foram construídos"; exit 1; fi
          if ! grep -q "Andar 1: 8 inimigos" servidor.log; then echo "Os inimigos do andar 1 não nasceram"; exit 1; fi
          echo "Servidor ligou e os 5 andares foram construídos"
