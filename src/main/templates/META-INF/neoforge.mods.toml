# Arquivo que diz ao NeoForge quem é o mod.
# Os valores entre chaves com cifrão são preenchidos automaticamente a partir do gradle.properties.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Louzada"
credits="Baseado no Shattered Pixel Dungeon, de Evan Debenham, que por sua vez é baseado no Pixel Dungeon, de Watabou."
description='''
O Shattered Pixel Dungeon dentro do Minecraft: o mundo inteiro é a dungeon.
'''

# Deixa o mod mudar as casinhas do inventário de lugar (o inventário do Shattered)
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Pequenas mudanças no próprio Minecraft (correr com fome)
[[mixins]]
config="pixeldungeon.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
