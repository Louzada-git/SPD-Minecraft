# Memória usada pelo Gradle. Se o seu PC tiver pouca RAM, pode baixar para -Xmx1G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Nomes de parâmetros mais legíveis no código do Minecraft (Parchment)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Versões do Minecraft e do NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[1,)

## Dados do mod

# Identificador do mod (só letras minúsculas, números e _). Tem que ser igual ao MODID em PixelDungeon.java
mod_id=pixeldungeon
# Nome que aparece na lista de mods (provisório)
mod_name=Pixel Dungeon MC
# Licença: GPLv3, a mesma do Shattered Pixel Dungeon
mod_license=GPL-3.0-or-later
# Versão do mod
mod_version=1.1
# Pacote base do código
mod_group_id=com.louzada.pixeldungeon
